lm_type: "claude-haiku-4-5-20251001"
retrieval_type: "bm25"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
cache_dir: "./cache"
device: "cpu"
use_reranker: false
candidate_k: 100
use_query_reformulation: false
use_dual_qr: true
query_reformulation_model: "o4-mini"
use_llm_reranker: true
llm_reranker_model: "o4-mini"
llm_reranker_window: 50
fail_fast_llm: true
use_history_postrank: true
history_postrank_weights:
  - 1.0
  - 0.0
  - 0.0
  - 4.0
  - 0.5
# v25 devset experiment
# OpenAI-only LLM path: o4-mini for dual-QR and listwise reranking.
# Keeps v24 deterministic history postrank and fail-fast LLM behavior.
# Requires OPENAI_API_KEY or OPENAI_RECSYS_API_KEY.
