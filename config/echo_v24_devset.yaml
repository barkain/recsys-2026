lm_type: "claude-haiku-4-5-20251001"
retrieval_type: "bm25"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
cache_dir: "./cache"
device: "cpu"
use_reranker: false
candidate_k: 100
use_query_reformulation: false
use_dual_qr: true
query_reformulation_model: "claude-haiku-4-5-20251001"
use_llm_reranker: true
llm_reranker_model: "claude-sonnet-4-6"
llm_reranker_window: 50
fail_fast_llm: true
use_history_postrank: true
history_postrank_weights:
  - 1.0
  - 0.0
  - 0.0
  - 4.0
  - 0.5
# v24 devset experiment
# v19 base + deterministic history postrank after Sonnet listwise reranking.
# Offline v23 partial postrank: 0.1033 -> 0.1177 nDCG on 200 cases by
# promoting same-artist/tag continuations already present in the top-20.
